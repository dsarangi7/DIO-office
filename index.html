  DIO OFFICE — "Dibya’s Intelligence Office" floor view
  ======================================================
  Single self-contained file: no network requests except an optional same-folder
  fetch of ./status.json (only when served over http). Opened by double-click
  (file://) it uses the copy of status.json embedded at the bottom of this file.

  status.json schema
  ------------------
  {
    "updatedAt": "ISO-8601 with offset, e.g. 2026-10-08T11:46:00+08:00",
    "agents": [
      { "id":     "god|shiva|alberto|mike|stacy|juan|chan|villain|hero|dwight",
        "name":   "display name",
        "role":   "short role",
        "status": "working | idle | reviewing | blocked",
        "task":   "one-line current task (shown in the speech bubble + side panel)",
        "room":   "desk | god-office | core | content | fixloop" }
    ],
    "handoffs": [ { "from": "agent id", "to": "agent id", "note": "what was handed over", "at": "ISO time" } ],
    "feed":     [ { "at": "ISO time", "agent": "agent id", "text": "activity line" } ]
  }

  Behaviour
  - Served (python3 -m http.server): polls status.json every 45 s. Any handoff whose
    from|to|at key hasn't been seen yet animates as a document flying desk → desk.
  - The most recent handoff animates once on load.
  - Unknown ids are ignored; unknown statuses fall back to "idle".
  - Idle agents walk to the bottom-right café. At most 3 may be off-desk
    (desk→café walk, seated, or holding a café seat). A further idle agent
    stays at their desk and shows “Café full (3/3)”. Agents still at their
    desk are not counted toward that cap.
  - URL params: ?demo=1  ?step=N (demo step)  ?theme=dark  ?select=<id>

  Fonts embedded (base64, subset): Silkscreen + Pixelify Sans, both SIL Open Font License 1.1.
  All art is drawn procedurally on a 320×208 canvas; no image assets.
-->

:root{
  --bg:#ece2cc; --bg2:#e4d8bd; --panel:#f6efe0; --card:#fbf6ea; --ink:#3a2e24; --ink2:#5c4c3d; --muted:#8c7b66;
  --line:#3a2e24; --soft:#d6c6a6; --shadow:#c9b894; --accent:#c0643a; --accent2:#e8b04e;
  --working:#5e8f4b; --idle:#a69680; --reviewing:#c98f2c; --blocked:#b84e38;
  --floor:#cdbb98; --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;
}
[data-theme=dark]{
  --bg:#1e1a16; --bg2:#25201b; --panel:#2a241e; --card:#322a23; --ink:#efe3cc; --ink2:#d2c3a8; --muted:#9d8d76;
  --line:#0f0c0a; --soft:#463b30; --shadow:#0f0c0a; --accent:#e07f4f; --accent2:#e8b04e;
  --working:#7fb766; --idle:#7d705f; --reviewing:#e0a841; --blocked:#e06a50; --floor:#2c261f;
}
*{box-sizing:border-box;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
html,body{margin:0;height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font:400 13px/1.35 "Pix",var(--cjk);
  display:grid; grid-template-rows:48px minmax(0,1fr) 104px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.silk{font-family:"Silk",var(--cjk);-webkit-font-smoothing:none;font-smooth:never;letter-spacing:.02em}
button,input{font:inherit;color:inherit}
/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:2px solid var(--line);position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand canvas{width:32px;height:32px;image-rendering:pixelated;display:block}
.brand h1{margin:0;font:700 16px/1 "Silk",var(--cjk);-webkit-font-smoothing:none;white-space:nowrap}
.brand .sub{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
.pipe{display:flex;align-items:center;gap:0;margin-left:auto;border:2px solid var(--line);background:var(--card);box-shadow:2px 2px 0 var(--shadow);height:28px}
.pipe .lbl{font:400 8px/1 "Silk";-webkit-font-smoothing:none;padding:0 8px;color:var(--muted);border-right:2px solid var(--line);height:100%;display:flex;align-items:center;text-transform:uppercase}
.pipe .st{display:flex;align-items:center;gap:5px;padding:0 9px;height:100%;font-weight:600;font-size:12px;color:var(--ink2);position:relative;white-space:nowrap}
.pipe .st + .st::before{content:"";position:absolute;left:-4px;top:50%;width:6px;height:6px;margin-top:-3px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg)}
.pipe .st i{width:6px;height:6px;background:var(--idle);display:inline-block}
.pipe .st.on{color:var(--ink);background:color-mix(in srgb,var(--accent2) 28%,transparent)}
.pipe .st.on i{background:var(--working);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.right{display:flex;align-items:center;gap:10px}
.src{font:400 8px/1 "Silk";-webkit-font-smoothing:none;padding:5px 6px;border:2px solid var(--line);background:var(--card);text-transform:uppercase;white-space:nowrap}
.src.live{color:var(--working)} .src.demo{color:var(--accent)}
.clock{font-weight:600;font-size:13px;white-space:nowrap;min-width:154px;text-align:right}
.clock small{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px}
.btn{height:28px;padding:0 10px;border:2px solid var(--line);background:var(--card);box-shadow:2px 2px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:600;font-size:12px;white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.sw{width:22px;height:12px;border:2px solid var(--line);background:var(--soft);position:relative;display:inline-block}
.sw::after{content:"";position:absolute;top:0;left:0;width:8px;height:8px;background:var(--ink2);transition:left .12s steps(2)}
.btn[aria-pressed=true] .sw{background:var(--accent)} .btn[aria-pressed=true] .sw::after{left:10px;background:var(--card)}
/* ---------- main ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 304px;min-height:0}
.floor{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden;
  background:var(--bg2);
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1px);background-size:8px 8px}
.stage{position:relative;border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);background:var(--floor)}
#scene{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
#overlay{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translateX(-50%);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:4px;
  padding:1px 5px 1px 4px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:12px;line-height:13px;white-space:nowrap;color:var(--ink)}
.tag i,.dot{width:7px;height:7px;display:inline-block;background:var(--idle);flex:none}
.s-working i,.dot.s-working{background:var(--working)} .s-reviewing i,.dot.s-reviewing{background:var(--reviewing)}
.s-blocked i,.dot.s-blocked{background:var(--blocked)} .s-idle i{background:var(--idle)}
.tag.sel{background:var(--ink);color:var(--card)}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:228px;width:max-content;padding:3px 6px 4px;white-space:nowrap;text-overflow:ellipsis;background:#fffaf0;color:#3a2e24;border:2px solid #3a2e24;
  font-size:11.5px;line-height:13px;font-weight:500;pointer-events:auto;cursor:pointer;
  overflow:hidden;box-shadow:2px 2px 0 rgba(58,46,36,.25)}
.bubble::before{content:"";display:inline-block;width:6px;height:6px;margin-right:4px;vertical-align:1px;background:var(--working)}

/* =================== café idle motion =================== */
const CAFE_CAP = 3; // people off-desk, not furniture
// Bottom-right chill zone on the 320×208 floor. Only the first CAFE_CAP seats are assigned.
const CAFE_SPOTS = [
  {x:222, y:158, kind:"sit", pair:1},   // round table, left stool
  {x:254, y:158, kind:"sit", pair:0},   // round table, right stool
  {x:296, y:196, kind:"sofa", pair:-1}, // corner sofa
];
const cafeAssign = {}; // id -> spot index, only after they leave the desk
const cafeAnim = {};   // id -> {fromX,fromY,toX,toY,t0,dur,phase,facing}
const cafeReject = {}; // id -> toast; idle agents refused a seat, still at the desk
function deskAnchor(id){ const d=DEFS[id]; return {x:d.cx, y:d.hy}; }
function cafeSeatCount(){ return ORDER.reduce((n,id)=>n+(cafeAssign[id]!=null?1:0),0); }
function isCafeRejected(id){
  const a=view.agents[id];
  return !!(a && a.status==="idle" && cafeReject[id] && cafeAssign[id]==null);
}
function startCafeWalk(id, pick){
  const spot=CAFE_SPOTS[pick], desk=deskAnchor(id);
  const prev=cafeAnim[id];
  const leftDesk = prev && prev.phase!=="desk" && prev.phase!=="rejected";
  const fromX = leftDesk ? (prev.x||desk.x) : desk.x;
  const fromY = leftDesk ? (prev.y||desk.y) : desk.y;
  cafeAnim[id]={fromX,fromY,toX:spot.x,toY:spot.y,x:fromX,y:fromY,t0:performance.now(),dur:1800+Math.random()*900,phase:"walk",facing:spot.x>=fromX?1:-1,spot:pick};
}
function rejectCafe(id){
  const n=cafeSeatCount();
  cafeReject[id] = n>=CAFE_CAP ? "Café full ("+CAFE_CAP+"/"+CAFE_CAP+")" : "No seats — wait";
  const desk=deskAnchor(id);
  const an=cafeAnim[id];
  if(an && (an.phase==="walk" || an.phase==="cafe") && cafeAssign[id]==null){
    cafeAnim[id]={fromX:an.x||desk.x,fromY:an.y||desk.y,toX:desk.x,toY:desk.y,x:an.x||desk.x,y:an.y||desk.y,t0:performance.now(),dur:1400,phase:"return",facing:desk.x>=(an.x||desk.x)?1:-1,spot:null};
    return;
  }
  if(!an || an.phase==="desk" || an.phase==="rejected"){
    cafeAnim[id]={phase:"rejected",x:desk.x,y:desk.y,spot:null};
  }
}
function reassignCafe(){
  const idle = ORDER.filter(id=>view.agents[id] && view.agents[id].status==="idle");
  const idleSet = new Set(idle);
  // non-idle: leave the café and walk back. Desk AFK is not a seat.
  ORDER.forEach(id=>{
    if(idleSet.has(id)) return;
    delete cafeReject[id];
    const an=cafeAnim[id];
    const away = cafeAssign[id]!=null || (an && (an.phase==="walk" || an.phase==="cafe" || an.phase==="return"));
    if(!away){
      cafeAnim[id]={phase:"desk",x:DEFS[id].cx,y:DEFS[id].hy};
      delete cafeAssign[id];
      return;
    }
    if(an && an.phase==="return"){ delete cafeAssign[id]; return; }
    const desk=deskAnchor(id);
    const cur=an||{x:desk.x,y:desk.y};
    cafeAnim[id]={fromX:cur.x||desk.x,fromY:cur.y||desk.y,toX:desk.x,toY:desk.y,x:cur.x||desk.x,y:cur.y||desk.y,t0:performance.now(),dur:1400,phase:"return",facing:desk.x>=(cur.x||desk.x)?1:-1,spot:null};
    delete cafeAssign[id];
  });
  idle.forEach(id=>{
    if(cafeAssign[id]!=null && (cafeAssign[id]<0 || cafeAssign[id]>=CAFE_CAP || cafeAssign[id]>=CAFE_SPOTS.length)) delete cafeAssign[id];
  });
  const used = new Set();
  idle.forEach(id=>{ if(cafeAssign[id]!=null) used.add(cafeAssign[id]); });
  // Fill in floor order. Already-seated idle agents keep their seat.
  idle.forEach(id=>{
    if(cafeAssign[id]!=null){ delete cafeReject[id]; return; }
    if(used.size>=CAFE_CAP){ rejectCafe(id); return; }
    let pick=-1;
    for(let i=0;i<CAFE_CAP && i<CAFE_SPOTS.length;i++){ if(!used.has(i)){ pick=i; break; } }
    if(pick<0){ rejectCafe(id); return; }
    delete cafeReject[id];
    cafeAssign[id]=pick; used.add(pick);
    startCafeWalk(id, pick);
  });
}
function agentPos(id, now){
  const d=DEFS[id], a=view.agents[id];
  if(!a || a.status!=="idle"){
    const an=cafeAnim[id];
    if(an && an.phase==="return"){
      const p=Math.min(1, Math.max(0,(now-an.t0)/an.dur));
      const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      an.x=an.fromX+(an.toX-an.fromX)*e;
      an.y=an.fromY+(an.toY-an.fromY)*e;
      if(p>=1){ an.phase="desk"; an.x=d.cx; an.y=d.hy; }
      return {x:an.x, y:an.y, atCafe:false, walking:p<1, facing:an.facing||1, spot:null, rejected:false};
    }
    return {x:d.cx, y:d.hy, atCafe:false, walking:false, facing:1, spot:null, rejected:false};
  }
  let an=cafeAnim[id];
  if(!an || an.phase==="desk" || an.phase==="return" || an.phase==="rejected"){
    reassignCafe();
    an=cafeAnim[id];
  }
  if(isCafeRejected(id)){
    if(an && an.phase==="return"){
      const p=Math.min(1, Math.max(0,(now-an.t0)/an.dur));
      const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      an.x=an.fromX+(an.toX-an.fromX)*e;
      an.y=an.fromY+(an.toY-an.fromY)*e;
      if(p>=1){ an.phase="rejected"; an.x=d.cx; an.y=d.hy; }
      return {x:an.x, y:an.y, atCafe:false, walking:p<1, facing:an.facing||1, spot:null, rejected:true};
    }
    return {x:d.cx, y:d.hy, atCafe:false, walking:false, facing:1, spot:null, rejected:true};
  }
  if(!an) return {x:d.cx, y:d.hy, atCafe:false, walking:false, facing:1, spot:null, rejected:false};
  if(an.phase==="walk"){
    const p=Math.min(1, Math.max(0,(now-an.t0)/an.dur));
    const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    an.x=an.fromX+(an.toX-an.fromX)*e;
    an.y=an.fromY+(an.toY-an.fromY)*e;
    if(p>=1){ an.phase="cafe"; an.x=an.toX; an.y=an.toY; an.t0=now; }
    return {x:an.x, y:an.y, atCafe:p>=1, walking:p<1, facing:an.facing||1, spot:an.spot, rejected:false};
  }
  // cafe idle behaviors cycle
  an.x=an.toX; an.y=an.toY;
  return {x:an.x, y:an.y, atCafe:true, walking:false, facing:an.facing||1, spot:an.spot, rejected:false};
}

/* =================== main loop =================== */
const blinkAt = {}; ORDER.forEach((id,i)=>blinkAt[id]=2000+i*700);
function frame(now){
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bg,0,0);
  // desk lamp glows (night)
  if(P.lamp){ ORDER.forEach(id=>{ const d=DEFS[id], a=view.agents[id]; if(a.status==="idle") return;
      ctx.fillStyle=P.lamp; ctx.fillRect(d.cx-20,d.hy+9,40,14); ctx.fillRect(d.cx-16,d.hy+5,32,22); ctx.fillRect(d.cx-11,d.hy+2,22,28); }); }
  // characters (idle → café walk / sit / drink / chat)
  ORDER.forEach((id,i)=>{
    const d=DEFS[id], a=view.agents[id], sp=SPR[id];
    const t=now/1000+i*.37;
    const pos=agentPos(id, now);
    let bob=0;
    if(a.status==="idle"){
      if(pos.walking) bob = (Math.floor(t*6)%2);
      else bob = (Math.sin(t*1.4)>0.55)?1:0;
    } else if(a.status==="working") bob = (Math.sin(t*5)>0.3)?1:0;
    else if(a.status==="reviewing") bob = (Math.sin(t*2.2)>0)?1:0;
    const x=Math.round(pos.x)-6, y=Math.round(pos.y)-3+bob;
    ctx.drawImage(sp.cv,x,y);
    if(now>blinkAt[id]){ if(now>blinkAt[id]+130) blinkAt[id]=now+2500+Math.random()*3500;
      else { ctx.fillStyle=sp.skin; ctx.fillRect(x+4,y+7,1,1); ctx.fillRect(x+7,y+7,1,1); } }
    // walk legs flicker
    if(pos.walking){
      const leg=Math.floor(t*8)%2;
      ctx.fillStyle=d.shade; ctx.fillRect(x+3,y+16,2,1); ctx.fillRect(x+7+leg,y+16,2,1);
    }
  });
  ctx.drawImage(fg,0,0);
  // per-agent dynamic bits
  ORDER.forEach((id,i)=>{
    const d=DEFS[id], a=view.agents[id], sp=SPR[id];
    const t=now/1000+i*.37;
    const pos=agentPos(id, now);
    const yDesk=d.hy+11;
    if(a.status==="working"){
      const f=Math.floor(t*8)%2;
      ctx.fillStyle=sp.skin; ctx.fillRect(d.cx-4,yDesk+2+f,2,1); ctx.fillRect(d.cx+2,yDesk+3-f,2,1);
      const mx=d.cx+(id==="god"?8:6), mw=id==="god"?12:9;
      ctx.fillStyle=P.glow; ctx.globalAlpha=.55+.25*Math.sin(t*3); ctx.fillRect(mx-1,yDesk-6,1,7); ctx.fillRect(mx,yDesk-7,mw,1); ctx.globalAlpha=1;
    } else if(a.status==="reviewing"){
      const wob=Math.floor(t*2)%2;
      ctx.fillStyle=P.paper; ctx.fillRect(d.cx-4,yDesk-1+wob,8,6); ctx.fillStyle=P.paperL; ctx.fillRect(d.cx-3,yDesk+1+wob,6,1); ctx.fillRect(d.cx-3,yDesk+3+wob,4,1);
      ctx.fillStyle=sp.skin; ctx.fillRect(d.cx-5,yDesk+2+wob,1,2); ctx.fillRect(d.cx+4,yDesk+2+wob,1,2);
    } else if(a.status==="blocked"){
      const on=Math.floor(t*3)%2;
      if(on){ ctx.fillStyle="#b84e38"; ctx.fillRect(d.cx+7,d.hy-4,2,4); ctx.fillRect(d.cx+7,d.hy+1,2,1); }
      ctx.fillStyle=sp.skin; ctx.fillRect(d.cx-4,yDesk+1,2,1); ctx.fillRect(d.cx+2,yDesk+1,2,1);
    } else if(pos.atCafe){
      const spot = pos.spot!=null ? CAFE_SPOTS[pos.spot] : null;
      const ax=Math.round(pos.x), ay=Math.round(pos.y);
      const kind = spot ? spot.kind : "stand";
      // drink: mug raise
      if(kind==="drink" || (kind==="sit" && Math.sin(t*0.7+i)>0.2)){
        const raise = (Math.sin(t*2.2+i)>0.35)?1:0;
        ctx.fillStyle=P.mug; ctx.fillRect(ax+(pos.facing>0?5:-7), ay-1-raise, 3, 3);
        ctx.fillStyle=P.coffee; ctx.fillRect(ax+(pos.facing>0?6:-6), ay-raise, 1, 1);
        ctx.fillStyle=sp.skin; ctx.fillRect(ax+(pos.facing>0?4:-6), ay+2, 2, 1);
      } else {
        ctx.fillStyle=sp.skin; ctx.fillRect(ax-4, ay+8, 2, 1); ctx.fillRect(ax+2, ay+8, 2, 1);
      }
      // chat ticks with pair
      if(spot && spot.pair>=0){
        const partnerId = ORDER.find(oid=>cafeAssign[oid]===spot.pair && view.agents[oid].status==="idle");
        if(partnerId){
          const tick = Math.floor(t*3+i)%4;
          if(tick<2){
            const midX = Math.round((ax + CAFE_SPOTS[spot.pair].x)/2);
            const midY = Math.min(ay, CAFE_SPOTS[spot.pair].y) - 6 - tick;
            ctx.fillStyle=P.night?"#e8b04e":"#c0643a";
            ctx.fillRect(midX, midY, 2, 2);
            ctx.fillRect(midX+3, midY-2, 1, 1);
            ctx.fillRect(midX-2, midY-1, 1, 1);
          }
        }
      }
    }
  });
  // keep overlay tags near moving café agents
  if(Math.floor(now/200)!==Math.floor((now-16)/200)) layoutOverlay();
  // meeting room presence + TVs
  ROOMS.forEach(r=>{
    const here = ORDER.filter(id=>view.agents[id].room===r.id && view.agents[id].status!=="idle");
    if(!here.length) return;
    const tvx=r.x+r.w-21, tvy=r.y+3;
    ctx.fillStyle=P.tvOn; ctx.fillRect(tvx,tvy,14,8);
    ctx.fillStyle="#2f5f58"; const k=Math.floor(now/400)%4;
    for(let i=0;i<4;i++){ const hgt=2+((i+k)%4); ctx.fillRect(tvx+2+i*3,tvy+7-hgt,2,hgt); }
    const tx=r.x+Math.floor(r.w/2)-21, ty=r.y+28;
    here.slice(0,3).forEach((id,i)=>{ // tiny heads in the top chairs
      const sp=SPR[id]; ctx.drawImage(sp.cv,0,0,12,12,tx+2+i*14,ty-11,12,12);
    });
    ctx.fillStyle=P.paper; ctx.fillRect(tx+8,ty+4,6,4); ctx.fillRect(tx+26,ty+5,6,4);
    ctx.fillStyle=P.paperL; ctx.fillRect(tx+9,ty+5,4,1); ctx.fillRect(tx+27,ty+6,4,1);
  });
  // selection brackets
  if(selected){
    const pos=agentPos(selected, now);
    const d=DEFS[selected], w=(selected==="god"&&!pos.atCafe?44:34), x=pos.x-w/2, y=pos.y-6, h=30;
    const o=(Math.floor(now/300)%2);
    ctx.fillStyle="#c0643a";
    [[x-o,y-o,1,1],[x+w+o-1,y-o,-1,1],[x-o,y+h+o-1,1,-1],[x+w+o-1,y+h+o-1,-1,-1]].forEach(([cx,cy,sx,sy])=>{
      ctx.fillRect(sx>0?cx:cx-3,cy,4,1); ctx.fillRect(cx,sy>0?cy:cy-3,1,4);
    });
  }
  // flights
  for(let i=flights.length-1;i>=0;i--){
    const f=flights[i]; const p=(now-f.t0)/f.dur;
    if(p<0) continue;
    if(p>=1){ flights.splice(i,1); pulses.push({id:f.to,t0:now}); arrivePop(f.to); renderPipeOnly(); continue; }
    const A=anchor(f.from), B=anchor(f.to);
    const e = p<.5? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    const lx=A.x+(B.x-A.x)*e, ly=A.y+(B.y-A.y)*e;
    const arc=Math.min(46,18+Math.hypot(B.x-A.x,B.y-A.y)*.22);
    const z=Math.sin(Math.PI*e)*arc;
    // faint dotted route still ahead
    ctx.fillStyle=P.night?"#e8b04e":"#c0643a"; ctx.globalAlpha=.35;
    for(let q=e+.04;q<1;q+=.045){ const qx=A.x+(B.x-A.x)*q, qy=A.y+(B.y-A.y)*q-Math.sin(Math.PI*q)*arc; ctx.fillRect(Math.round(qx)+2,Math.round(qy)+3,1,1); }
    ctx.globalAlpha=1;
    // trail
    for(let k=1;k<6;k++){ const pe=Math.max(0,e-k*.035); const tx=A.x+(B.x-A.x)*pe, ty=A.y+(B.y-A.y)*pe-Math.sin(Math.PI*pe)*arc;
      ctx.fillStyle=k%2?"#e8b04e":"#c0643a"; ctx.globalAlpha=.6-k*.1; ctx.fillRect(Math.round(tx)+2,Math.round(ty)+3,1,1); }
    ctx.globalAlpha=1;
    // shadow
    ctx.fillStyle=P.shadow; ctx.fillRect(Math.round(lx)-1,Math.round(ly)+6,7,2);
    // paper (flutters)
    const px=Math.round(lx), py=Math.round(ly-z), fl=Math.floor(now/90)%4;
    ctx.fillStyle="#2b211a"; ctx.fillRect(px-1,py-1,8,9-(fl===2?1:0));
    ctx.fillStyle="#fffaf0"; ctx.fillRect(px,py,6,7-(fl===2?1:0));
    ctx.fillStyle="#c0643a"; ctx.fillRect(px+1,py+1,4,1);
    ctx.fillStyle="#b9ad97"; ctx.fillRect(px+1,py+3,4,1); if(fl!==2) ctx.fillRect(px+1,py+5,3,1);
    if(fl===1){ ctx.fillStyle="#e7dcc4"; ctx.fillRect(px+4,py,2,2); }
  }
  // arrival pulses
  for(let i=pulses.length-1;i>=0;i--){
    const pu=pulses[i], p=(now-pu.t0)/600; if(p>=1){ pulses.splice(i,1); continue; }
    const d=DEFS[pu.id], r=Math.round(4+p*10);
    ctx.fillStyle="#e8b04e"; ctx.globalAlpha=1-p;
    ctx.fillRect(d.cx-r,d.hy+13,2,1); ctx.fillRect(d.cx+r-2,d.hy+13,2,1); ctx.fillRect(d.cx-1,d.hy+13-r,2,1); ctx.fillRect(d.cx-1,d.hy+13+Math.round(r/2),2,1);
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
function arrivePop(id){
  const d=DEFS[id]; const el=document.createElement("div"); el.className="pop"; el.textContent="+1 doc";
  el.style.left=((d.cx+10)*scale)+"px"; el.style.top=((d.hy+6)*scale)+"px";
  overlay.appendChild(el); setTimeout(()=>el.remove(),1700);
}
function renderPipeOnly(){
  const active=new Set(); ORDER.forEach(id=>{ if(view.agents[id].status!=="idle") active.add(DEFS[id].stage); });
  flights.forEach(f=>active.add(DEFS[f.to].stage));
  [...$("#pipe").querySelectorAll(".st")].forEach((el,i)=>el.classList.toggle("on",active.has(STAGES[i].k)));
}

/* =================== live data =================== */
function applyLive(data, animateNew){
  live = normalize(data);
  const newOnes = live.handoffs.filter(h=>!seen.has(hKey(h)));
  live.handoffs.forEach(h=>seen.add(hKey(h)));
  if(demo.on) return;
  view = live; renderAgents();
  if(animateNew) newOnes.forEach((h,i)=>launch(h,i*350));
}
async function poll(first){
  if(location.protocol==="file:") return false;
  try{
    const r = await fetch("./status.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    source="live"; setSrc();
    applyLive(data, !first);
    return true;
  }catch(err){ if(first){ source="embedded"; setSrc(); } return false; }
}
function setSrc(){
  const el=$("#src");
  if(demo.on){ el.textContent="demo script"; el.className="src demo"; return; }
  el.textContent = source==="live"?"live · status.json":"embedded data";
  el.className = "src "+(source==="live"?"live":"");
}

];
const demo = {on:false, step:0, timer:null, data:null};
const STEP_MS = 3900;
function demoReset(){
  const d={updatedAt:new Date().toISOString(), agents:{}, handoffs:[], feed:[]};
  ORDER.forEach(id=>{ d.agents[id]={id,name:DEFS[id].name,role:DEFS[id].role,status:"idle",task:IDLE_TASKS[id],room:id==="god"?"god-office":"desk"}; });
  return d;
}
function demoApply(i){
  const st=DEMO[i]; const now=new Date(); const iso=now.toISOString();
  if(i===0) demo.data=demoReset();
  const d=demo.data;
  Object.entries(st.set||{}).forEach(([id,v])=>Object.assign(d.agents[id],v));
  (st.feed||[]).forEach(([agent,text])=>d.feed.push({at:iso,agent,text}));
  (st.hand||[]).forEach(([from,to,note],k)=>{ const h={from,to,note,at:iso}; d.handoffs.push(h); launch(h,k*280); });
  d.updatedAt=iso;
  view=d; renderAgents();
}
function demoTick(){ demoApply(demo.step); demo.step=(demo.step+1)%DEMO.length; }
function setDemo(on, startStep){
  demo.on=on; $("#demoBtn").setAttribute("aria-pressed",String(on)); clearInterval(demo.timer); flights.length=0;
  if(on){
    demo.data=demoReset();
    const s = Math.max(0,Math.min(DEMO.length-1,startStep||0));
    for(let i=0;i<s;i++){ // fast-forward silently
      const st=DEMO[i]; Object.entries(st.set||{}).forEach(([id,v])=>Object.assign(demo.data.agents[id],v));
      const iso=new Date(Date.now()-(s-i)*STEP_MS).toISOString();
      (st.feed||[]).forEach(([agent,text])=>demo.data.feed.push({at:iso,agent,text}));
      (st.hand||[]).forEach(([from,to,note])=>demo.data.handoffs.push({from,to,note,at:iso}));
    }
    demo.step=s; demoTick(); demo.timer=setInterval(demoTick,STEP_MS);
  } else { view=live; renderAgents(); }
  setSrc();
}

  const now=performance.now();
  const hit=ORDER.find(id=>{ const pos=agentPos(id,now), w=id==="god"&&!pos.atCafe?22:16; return x>=pos.x-w && x<=pos.x+w && y>=pos.y-4 && y<=pos.y+22; });

});
